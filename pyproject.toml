[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kosync-hub"
version = "1.0.0"
description = "KOReader Multi-Sync Hub & Bridge synchronizing reading progress between Kavita and Calibre"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "KOReader Sync Community" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.scripts]
kosync-hub = "kosync_hub.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
